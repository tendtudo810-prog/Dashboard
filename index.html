<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <main>
        <div class="item active" style="--background: #ea3d41">
            <div class="title">Morango</div>
            <img src="img/Morango-refrigerante-foregroundBlur.png" alt="" class="fruit">
            <img src="img/Morango-refrigerante.png" alt="" class="refri">
        </div>

        <div class="item " style="--background: #2d5643">
            <div class="title">Abacate</div>
            <img src="img/Abacate-refrigerante-foregroundBlur.png" alt="" class="fruit">
            <img src="img/Abacate-refrigerante.png" alt="" class="refri">
        </div>

        <div class="item hidden" style="--background: #e7a043">
            <div class="title">Laranja</div>
            <img src="img/Laranja-refrigerante-foregroundBlur.png" alt="" class="fruit">
            <img src="img/Laranja-refrigerante.png" alt="" class="refri">
        </div>

        <div class="arrow">
            <button> < </button>
            <button> > </button>
        </div>
    </main>
</body>

</html>
