<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body style="--fundo: #241818">
    <header class="site-header">
        <div class="brand">
            <i class="fa-brands fa-algolia" style="color: rgba(255, 255, 255, 0.622);"></i>
            <label for="#" class="brand-name">Algolia</label>
        </div>

        <nav class="nav-menu">
            <a href="#">Home</a>
            <a href="#">Sabores</a>
            <a href="#">Sobre</a>
            <a href="#">Contato</a>
        </nav>

        <a href="#" class="btn-cta">Faça seu cadastro</a>
    </header>

    <main>
        <div class="item active" style="--background: #76201f">
            <div class="title">Morango</div>
            <img src="img/Morango-refrigerante-foregroundBlur.png" alt="" class="fruit">
            <img src="img/Morango-refrigerante.png" alt="" class="refri">
        </div>

        <div class="item " style="--background: #117747">
            <div class="title">Abacate</div>
            <img src="img/Abacate-refrigerante-foregroundBlur.png" alt="" class="fruit">
            <img src="img/Abacate-refrigerante.png" alt="" class="refri">
        </div>

        <div class="item hidden" style="--background: #d48011">
            <div class="title">Laranja</div>
            <img src="img/Laranja-refrigerante-foregroundBlur.png" alt="" class="fruit">
            <img src="img/Laranja-refrigerante.png" alt="" class="refri">
        </div>
    </main>

    <!-- Modal de Produto -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <button class="modal-close" id="closeModal">&times;</button>
            <div class="modal-product">
                <img src="" alt="" class="modal-image" id="modalImage">
                <div class="modal-info">
                    <h2 id="modalTitle">Título do Produto</h2>
                    <p id="modalDescription">Descrição do produto</p>
                    <button class="btn-comprar">Comprar Agora</button>
                </div>
            </div>
        </div>
    </div>

    <script src="javascript.js"></script>
</body>

</html>
