<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body style="--fundo: #241818">
    <header class="site-header">
        <div class="brand">
            <i class="fa-brands fa-algolia" style="color: rgba(255, 255, 255, 0.622);"></i>
            <label for="#" class="brand-name">Algolia</label>
        </div>

        <nav class="nav-menu">
            <a href="#">Home</a>
            <a href="#">Sabores</a>
            <a href="#">Sobre</a>
            <a href="#">Contato</a>
        </nav>

        <a href="#" class="btn-cta">Faça seu cadastro</a>
    </header>

    <main>
        <div class="item active" style="--background: #76201f">
            <div class="title">Morango</div>
            <img src="img/Morango-refrigerante-foregroundBlur.png" alt="" class="fruit">
            <img src="img/Morango-refrigerante.png" alt="" class="refri">
        </div>

        <div class="item " style="--background: #2d5643">
            <div class="title">Abacate</div>
            <img src="img/Abacate-refrigerante-foregroundBlur.png" alt="" class="fruit">
            <img src="img/Abacate-refrigerante.png" alt="" class="refri">
            <img src="img/soft-vintage-gradient-blur-background-with-pastel-colored-well-use-as-studio-room-product-presentation-banner.jpg"
                alt="">
        </div>

        <div class="item hidden" style="--background: #e7a043">
            <div class="title">Laranja</div>
            <img src="img/Laranja-refrigerante-foregroundBlur.png" alt="" class="fruit">
            <img src="img/Laranja-refrigerante.png" alt="" class="refri">
            <img src="img/abstract-smooth-orange-background-layout-design-studio-room-web-template-business-report-with-smooth-circle-gradient-color.jpg"
                alt="">
        </div>

        <div class="arrow">
            <button>
                < </button>
                    <button> > </button>
        </div>

        <div class="text">
            <h1 class="title1">Sabores Novos em Breve</h1>
        </div>

        <div class="pictures">
            <img src="img/Sabores (1).png" alt="" class="p1" data-product="Sabor 1"
                data-description="Defrute do nosso novo sabor exclusivo. Uma combinação perfeita de ingredientes naturais que proporciona uma experiência refrescante e única. Ideal para os momentos especiais do seu dia.">
            <img src="img/Sabores (2).png" alt="" class="p1" data-product="Sabor 2"
                data-description="Experiência tropical irresistível. Feito com os melhores ingredientes selecionados, este sabor traz uma explosão de frescor em cada gole. Perfeito para compartilhar com amigos e família.">
            <img src="img/Sabores (3).png" alt="" class="p1" data-product="Sabor 3"
                data-description="Frescor em cada gole. Uma bebida refrescante e saudável, desenvolvida com cuidado para oferecer o melhor sabor. Ideal para se refrescar em qualquer momento do dia.">
        </div>
    </main>

    <!-- Modal de Produto -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <button class="modal-close" id="closeModal">&times;</button>
            <div class="modal-product">
                <img src="" alt="" class="modal-image" id="modalImage">
                <div class="modal-info">
                    <h2 id="modalTitle">Título do Produto</h2>
                    <p id="modalDescription">Descrição do produto</p>
                    <button class="btn-comprar">Comprar Agora</button>
                </div>
            </div>
        </div>
    </div>

    

    <script src="javascript.js"></script>
</body>

</html>
